# nginx_mcp.conf — Reverse proxy for the MCP HTTP server.
#
# Install:
#   sudo cp nginx_mcp.conf /etc/nginx/sites-available/mcp
#   sudo ln -s /etc/nginx/sites-available/mcp /etc/nginx/sites-enabled/mcp
#   sudo nginx -t && sudo nginx -s reload
#
# On macOS with Homebrew nginx, copy to $(brew --prefix)/etc/nginx/servers/mcp.conf
#
# To add TLS, replace the listen directive and add ssl_certificate / ssl_certificate_key.

server {
    listen 8080;
    server_name _;

    # MCP JSON-RPC endpoint
    location /mcp {
        proxy_pass         http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Authorization $http_authorization;
        proxy_read_timeout 30s;

        # Only allow POST
        limit_except POST {
            deny all;
        }
    }

    # Health check (allow GET)
    location /health {
        proxy_pass         http://127.0.0.1:8888;
        proxy_http_version 1.1;
    }

    # Block everything else
    location / {
        return 404;
    }
}
